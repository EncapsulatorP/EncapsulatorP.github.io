<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EncapsulatorP · responsive preview</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:24px;background:#15272e;color:#eef5ed;font:14px/1.5 system-ui,sans-serif}header{max-width:1000px;margin:0 auto 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}label{display:flex;gap:8px;align-items:center}select,a{font:inherit;color:inherit;background:#29434a;padding:7px 10px;border:1px solid #547076;border-radius:6px}main{width:max-content;max-width:none;margin:auto}iframe{display:block;width:390px;height:844px;border:1px solid #6c8586;border-radius:14px;background:#f5f2eb}p{font-size:12px;color:#bbcec5;text-align:center}
</style>
<header><h1>Responsive preview</h1><label>Width <select id="qa-width"><option value="390">390 px · phone</option><option value="768">768 px · tablet</option><option value="1024">1024 px · desktop</option></select></label><label>View <select id="qa-room"><option value="#paper-table">Workbench</option><option value="#paper-atlas">Paper map</option><option value="#collatz">Collatz</option><option value="#kesten-goldie">Kesten–Goldie</option><option value="#atlas">Atlas</option></select></label><a href="../index.html?edition=unfold-r3#paper-table">Open full atlas</a></header>
<main><iframe id="qa-frame" title="Responsive EncapsulatorP preview" src="../index.html?edition=unfold-r3#paper-table" width="390" height="844"></iframe><p>Fixed frame sizes exercise the page’s own responsive layout.</p></main>
<script>
  const frame = document.getElementById('qa-frame');
  document.getElementById('qa-width').addEventListener('change', event => { frame.style.width = event.target.value + 'px'; });
  document.getElementById('qa-room').addEventListener('change', event => { frame.src = '../index.html?edition=unfold-r3' + event.target.value; });
</script>
</html>
